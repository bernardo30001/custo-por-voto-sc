name: Pipeline de dados (TSE + IPCA)

# Roda o pipeline Python no GitHub (que acessa o CDN do TSE e a API do Banco Central),
# grava site/data/candidatos.json e o relatório de validação na main e dispara o deploy.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "inspect = só mostra layouts dos arquivos; build = gera os dados"
        type: choice
        options: [build, inspect]
        default: build

permissions:
  contents: write
  actions: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - name: Cache dos arquivos brutos do TSE
        uses: actions/cache@v4
        with:
          path: pipeline/raw
          key: tse-raw-v1-${{ hashFiles('pipeline/common.py') }}
          restore-keys: tse-raw-v1-
      - name: Inspecionar layouts
        if: inputs.modo == 'inspect'
        run: python inspect_layouts.py --download
      - name: Gerar dados
        if: inputs.modo == 'build'
        run: python build.py
      - name: Publicar dados na main
        if: inputs.modo == 'build'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat pipeline/relatorio_validacao.md >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/candidatos.json pipeline/relatorio_validacao.md
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados."
          else
            git commit -m "Atualiza dados do TSE e IPCA (pipeline)"
            git push
          fi
          gh workflow run deploy.yml --ref main
